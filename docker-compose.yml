services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink -d shortlink"]
      interval: 5s
      timeout: 5s
      retries: 5
    # порт нужен только для локальной разработки (go run на хосте, psql/DBeaver)
    # привязан к loopback, чтобы Postgres не был доступен из сети
    # внутри docker-сети app ходит по postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # порт нужен только для локальной разработки (go run на хосте, redis-cli)
    # привязан к loopback, чтобы Redis без пароля не был доступен из сети
    ports:
      - "127.0.0.1:6379:6379"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://shortlink:shortlink@postgres:5432/shortlink?sslmode=disable
      JWT_SECRET: change-me-in-production
      PORT: 8080
      # счетчики rate limiter в redis: в compose один app, но режим тот же, что нужен при нескольких инстансах
      RATE_STORE: redis
      REDIS_ADDR: redis:6379
      # APPLY_MIGRATIONS_ON_START не задан — используется значение по умолчанию (true) из main.go
    ports:
      - "8080:8080"

volumes:
  postgres_data:
